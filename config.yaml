# RAG With Cold API Documents — 全局配置
# API key 等敏感信息一律走环境变量，不写进 yaml。

embedder:
  type: bailian  # bailian | local

  bailian:
    # api_key 永远不写在这里。读环境变量 DASHSCOPE_API_KEY。
    model: qwen3.7-text-embedding
    dimension: 2560
    max_retries: 3
    timeout: 30

  local:
    dense_model: sentence-transformers/all-MiniLM-L6-v2
    dimension: 384
    bm25_language: zh

zvec:
  collection_path: ./data/zvec_collections
  default_collection: ascendc_api

api_name:
  # 从 title 字段去掉 "{name} {namespace} " 前缀
  # 例: "DataStoreBarrier com.huawei.cann.ascendc.op.910beta3 数据同步..."
  #   → "数据同步..."
  strip_pattern: "{name} {namespace} "
