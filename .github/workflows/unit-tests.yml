name: Python unit tests

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  # 如果以后启用 Merge Queue，需要保留此事件。
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: unit-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: unit-tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@v8
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Run unit tests
        id: pytest
        continue-on-error: true
        run: |
          set +e
          uv run pytest tests/unit --junitxml=test-results.xml
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Write test summary
        if: always()
        run: |
          python - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path

          report = Path("test-results.xml")

          if report.exists():
              root = ET.parse(report).getroot()
              suites = list(root.iter("testsuite"))

              total = sum(int(s.attrib.get("tests", 0)) for s in suites)
              failed = sum(int(s.attrib.get("failures", 0)) for s in suites)
              errors = sum(int(s.attrib.get("errors", 0)) for s in suites)
              skipped = sum(int(s.attrib.get("skipped", 0)) for s in suites)

              passed = total - failed - errors - skipped
              executed = total - skipped
              rate = passed / executed * 100 if executed else 0

              summary = f"""## Unit test result

          - Passed: {passed}
          - Failed: {failed + errors}
          - Skipped: {skipped}
          - Pass rate: {rate:.2f}%
          """
          else:
              summary = "## Unit test result\n\nNo test report was generated."

          print(summary)

          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open(
              "a", encoding="utf-8"
          ) as f:
              f.write(summary)
          PY

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-test-report
          path: test-results.xml
          if-no-files-found: ignore

      - name: Fail if tests failed
        if: steps.pytest.outputs.exit_code != '0'
        run: exit 1
